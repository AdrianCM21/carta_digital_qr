server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript image/svg+xml application/json;
  gzip_min_length 512;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "SAMEORIGIN" always;

  location = /healthz { access_log off; return 200 "ok"; }

  # Sin hash en los nombres de archivo: revalidar siempre para que un redeploy se vea al instante.
  location ~* \.(css|js)$ { add_header Cache-Control "no-cache"; }
  location ~* \.(jpg|jpeg|png|webp)$ { expires 7d; add_header Cache-Control "public"; }
  location = /index.html { add_header Cache-Control "no-cache"; }

  location / { try_files $uri $uri/ /index.html; }
}
